# Kontablo crosswalk: real us-gaap face-statement tags -> Kontablo core nodes
#
# WHAT THIS IS
#   A curated crosswalk from the us-gaap XBRL tags that real SEC filers actually
#   put on their face statements, to the 30-node Kontablo Level-3 core. Built for
#   Tier A1 / hypotheses H1 and H2 of research/real_data_validation_plan.md.
#
# BUILT FROM THE TRAIN WINDOW ONLY
#   Tags, labels and frequencies come from EDGAR 2024q1-2025q2
#   (research/experiments/tag_resolution_v1/derived/edgar_tags_train.csv.gz).
#   The holdout window (2025q3-2026q1) was never opened while authoring this
#   file. That is what makes the holdout score a real test rather than a
#   restatement of the training data.
#
# EVERY NON-MAPPING IS TYPED, NONE IS AN OMISSION
#   aggregate     a subtotal the ontology computes by rolling up leaves (Assets,
#                 GrossProfit, NetCashProvidedByUsedInOperatingActivities).
#                 Kontablo represents these as derived values, not as nodes.
#   out_of_scope  no Kontablo core node at any level -- period MOVEMENTS
#                 (IncreaseDecreaseIn*, ProceedsFrom*), residual "Other*"
#                 buckets, contra-accounts, and genuine gaps in the 30-node core
#                 (research and development, selling and marketing, personnel
#                 costs, non-controlling interest). The gaps are recorded rather
#                 than force-fitted: a wrong mapping is worse than an honest
#                 refusal, and these gaps are a finding in their own right.
#
# SELECTION RULE
#   Top 130 monetary standard face-statement tags by presentation frequency in the
#   train window (1,614,952 facts). Frequency rank is an objective,
#   pre-stated criterion, so the tag set cannot be accused of being chosen to
#   flatter the score.

