# Kontablo Localization Mapping: Mexico (SAT)
# Version: 0.2.0-draft
# Target: SAT Anexo 24 (Código Agrupador de Cuentas)
# v2 (ADR-016): adds OPTIONAL structure-preservation fields — local_parent
# (the SAT chart's own tree edges), facets (analytical dimensions the
# projection to a coarser Kontablo node would otherwise flatten silently),
# and aggregation_group (explicit N:1 fibers). Resolution behavior unchanged.

metadata:
  country: mx
  authority: SAT
  standard: anexo_24
  kontablo_version: 0.2.0
  last_updated: 2026-07-18

mappings:
  # --- ASSETS (ACTIVO) ---
  "100":
    name: "ACTIVO"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000001" # Assets
    aggregation_rules:
      - "sum"
    note: "Top grouping of the SAT Código Agrupador (Anexo 24); parent of 101-1xx."

  "101":
    name: "Caja"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000101" # Cash
    aggregation_rules:
      - "sum"
    local_parent: "100"

  "102":
    name: "Bancos"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000102" # Banks
    aggregation_rules:
      - "sum"
    local_parent: "100"

  "103":
    name: "Inversiones"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000103" # Short-term Investments
    aggregation_rules:
      - "sum"
    local_parent: "100"

  "104":
    name: "Clientes"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000104" # Trade Receivables
    aggregation_rules:
      - "sum"
    local_parent: "100"
    facets:
      polarity: "gross"
    aggregation_group: "mx_trade_receivables_net"

  "105":
    name: "Deudores diversos"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000105" # Other Receivables
    aggregation_rules:
      - "sum"
    local_parent: "100"

  "106":
    name: "Estimación de cuentas incobrables"
    nature: "Credit" # Contra-asset
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000104" # Subtracts from Trade Receivables
    aggregation_rules:
      - "subtract"
    local_parent: "100"
    facets:
      polarity: "contra"
    aggregation_group: "mx_trade_receivables_net"
    note: >
      Explicit N:1 fiber with 104: gross receivables minus this allowance
      collapse into the single Kontablo net-receivables node. The polarity
      facet names the axis that the projection flattens.

  "107":
    name: "Almacén"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000106" # Inventories
    aggregation_rules:
      - "sum"
    local_parent: "100"

  "108":
    name: "Impuestos a favor"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000107" # Current Tax Assets
    aggregation_rules:
      - "sum"
    local_parent: "100"
    facets:
      tax: "recoverable"


  # --- LIABILITIES (PASIVO) ---
  "200":
    name: "PASIVO"
    nature: "Credit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000004" # Liabilities
    aggregation_rules:
      - "sum"
    note: "Top grouping of the SAT Código Agrupador (Anexo 24); parent of 201-2xx."

  "201":
    name: "Proveedores"
    nature: "Credit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000201" # Trade Payables
    aggregation_rules:
      - "sum"
    local_parent: "200"

  "208":
    name: "Impuestos trasladados"
    nature: "Credit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000203" # Current Tax Liabilities (Translated)
    aggregation_rules:
      - "sum"
    local_parent: "200"
    facets:
      tax: "output_transferred"
    note: >
      SAT distinguishes taxes transferred to customers (trasladados) from taxes
      withheld (211). The tax facet preserves that axis of the SAT chart.

  "211":
    name: "Impuestos retenidos"
    nature: "Credit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000204" # Current Tax Liabilities (Withheld)
    aggregation_rules:
      - "sum"
    local_parent: "200"
    facets:
      tax: "withheld"


  # --- EQUITY & OTHERS (Capital, Ingresos, Costos, Gastos) ---
  "300":
    name: "CAPITAL CONTABLE"
    nature: "Credit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000007" # Equity
    aggregation_rules:
      - "sum"

  "400":
    name: "INGRESOS"
    nature: "Credit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000011" # Revenue
    aggregation_rules:
      - "sum"

  "500":
    name: "COSTOS"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000014" # Cost of Sales
    aggregation_rules:
      - "sum"

  "600":
    name: "GASTOS"
    nature: "Debit"
    level: 1
    kontablo_uuid: "00000000-0000-4000-8000-000000000015" # Operating Expenses
    aggregation_rules:
      - "sum"
