    onto Kontablo''s universal Level-3 ontology is many-to-one by design (principle: graph, not tree).
    is_aggregate=true means the code is a header/rollup row with more granular children in this same chart
    (never independently postable). is_statement_caption=true covers class-9 off-balance-sheet/management-accounting
    memoranda (optional per the source) and the class-1 ''soldes intermediaires de gestion'' computed
    subtotals (132-137). needs_review=true means no existing Level-3 node fits AND the code is a genuine
    leaf; the single largest honest gap is contra-asset/contra-liability accumulated-depreciation and
    provision accounts (classes 18/19/28/29/39/49/59/69/79 and most of HAO class 8), for which the 34-node
    Level-3 core has no dedicated node yet -- see research/coa_fidelity/STATUS.yaml.'
