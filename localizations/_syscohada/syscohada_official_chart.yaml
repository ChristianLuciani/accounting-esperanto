    '2': 297
    '3': 86
    '4': 260
    '5': 96
    '6': 267
    '7': 132
    '8': 56
    '9': 49
  duplicate_codes: null
  note: Verbatim transcription of the primary-source official chart shared by all 17 OHADA member states.
    No Kontablo UUID classification here by design -- see map_syscohada_chart.py. Unlike the Ecuador source,
    this table has no per-line debit/credit 'signe' column, so no 'nature' field is fabricated per entry;
    class 9 (comptes des engagements hors bilan et comptabilite analytique de gestion) is of 'application
    facultative' (optional) per the source itself and is transcribed for completeness but is not part
    of the mandatory postable ledger.
