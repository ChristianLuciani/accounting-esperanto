  source_url: https://www.msg-innov.online/gallery/ACTE%20UNIFORME%20SYSCOHADA%20REVISE.pdf
  source_instrument: Acte Uniforme relatif au Droit Comptable et a l'Information Financiere (AUDCIF),
    adopted 26 January 2017 (Journal Officiel OHADA, 15 February 2017), in force 1 January 2018 for individual
    accounts. Titre VII, Chapitre 2, Section 3 "Liste des comptes".
  extraction_command: 'pdftotext -layout <AUDCIF.pdf> audcif.txt && sed -n ''<first>,<last>p'' audcif.txt
    > liste_des_comptes.txt  # Titre VII / Chapitre 2 / Section 3, printed pages ~222-276'
  parser: scripts/coa_fidelity/parse_syscohada_chart.py
  total_accounts: 1399
  accounts_by_class:
