  name_raw: Subconta – Adoção Inicial -  Estoques de Mercadorias
  tipo: A
  conta_superior: 1.01.03.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram as diferenças positivas ou negativas, na data da adoção dos efeitos
    da Lei nº 12.973/2014, entre o valor do ativo mensurado de acordo as disposições da Lei nº 6.404/1976
    e o valor mensurado pelos métodos e critérios vigentes em 31/12/2007(arts. 66/67, Lei nº 12.973/2014).
    Referidos valores  deverão ser computados na apuração  Lucro Real à medida da realização do bem, (arts.
    164 e 167,  Instrução Normativa SRF nº 1.515/2014, cujos detalhes sobre a contabilização estão descritos
    em seu Anexo I,  exemplos 1/2). Conforme disciplinado art. 169, § 9ª, Instrução Normativa SRF nº 1.515/2014,
    cada subconta de adoção inicial deve registrar individualmente a diferença de valor identificada em
    cada ativo.  Apenas no caso da conta contábil que registra o ativo consolidar vários itens de mesma
    natureza, pode-se  utilizar uma mesma subconta coletiva, desde que demonstre-os em razão auxiliar
    vinculado à ECD(art. 169, §6º, Instrução Normativa SRF nº 1.515/2014)
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
