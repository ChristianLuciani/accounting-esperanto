- code: 3.01.01.05.01.02
  name: Ganhos Auferidos no Mercado de Renda Variável, exceto Day-Trade
  name_raw: Ganhos Auferidos no Mercado de Renda Variável, exceto Day-Trade
  tipo: A
  conta_superior: 3.01.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
  orientacoes: 'Contas que registram:

    a) o somatório dos ganhos auferidos, em cada mês do período de apuração, em operações realizadas nas
    bolsas de valores, de mercadorias, de futuros e assemelhadas, existentes no País;

    Atenção:

    1) Os ganhos auferidos em operações day-trade devem ser informados em conta específica.

    2) O valor correspondente às perdas incorridas no mercado de renda variável, exceto day-trade, deve
    ser informado em conta específica.

    3) São consideradas assemelhadas às bolsas de valores, de mercadorias e de futuros as entidades cujo
    objeto social seja análogo ao das referidas bolsas e que funcionem sob a supervisão e fiscalização
    da Comissão de Valores Mobiliários (CVM).'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.01.01.05.01.03
  name: Ganhos em Operações Day-Trade
  name_raw: Ganhos em Operações Day-Trade
  tipo: A
  conta_superior: 3.01.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
  orientacoes: Contas que registram os ganhos diários auferidos, em cada mês do período de apuração, em
    operações day-trade.  Considera-se ganho o resultado positivo auferido nas operações citadas acima,
    realizadas em cada mês, admitida a dedução dos custos e despesas incorridos, necessários à realização
    das operações.  Não se caracteriza como day-trade o exercício da opção e a venda ou compra do ativo
    no mercado à vista, no mesmo dia.  Também não se caracterizam como day-trade as operações iniciadas
    por intermédio de uma instituição e encerradas em outra, quando houver a liquidação física mediante
    movimentação de títulos ou valores mobiliários em custódia.
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.01.01.05.01.04
  name: Receitas de Juros sobre o Capital Próprio
  name_raw: Receitas de Juros sobre o Capital Próprio
  tipo: A
  conta_superior: 3.01.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
  orientacoes: 'Contas que registram os juros recebidos, a título de remuneração do capital próprio, em
    conformidade com o art. 9º da Lei nº 9.249, de 1995. O valor informado deve corresponder ao total
    dos juros recebidos antes do desconto do imposto de renda na fonte.

    O valor do imposto de renda retido na fonte, para as pessoas jurídicas tributadas pelo lucro real,
    é considerado antecipação do imposto devido no encerramento do período de apuração ou, ainda, pode
    ser compensado com aquele que for retido, pela beneficiária, por ocasião do pagamento ou crédito de
    juros a título de remuneração do capital próprio, ao seu titular ou aos seus sócios.'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
