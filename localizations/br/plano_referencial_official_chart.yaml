- code: 1.01.01.05.15
  name: Outros Empréstimos e Recebíveis - No País
  name_raw: Outros Empréstimos e Recebíveis - No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram outros empréstimos e recebíveis cuja contraparte tenha sede ou domicílio
    no país e que não estejam melhor classificados em outras contas mais específica, mesmo que extrapolem
    o conceito da Lei nº 6.385/76. Registram-se neste grupo ativos financeiros com pagamentos fixos ou
    determináveis não cotados em um mercado ativo. Esses títulos são avaliados pelo método de custo amortizado,
    com os custos de transação capitalizados ao valor do ativo. Instrumentos financeiros representativos
    da indenização, decorrente da exploração de serviços públicos, constumam receber esta classificação(item
    22, OCPC 05).
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.05.50
  name: Juros a Apropriar Decorrentes de Ajuste a Valor Presente (AVP) -  Valores Mobiliários - No País
  name_raw: (-) Juros a Apropriar Decorrentes de Ajuste a Valor Presente (AVP) -  Valores Mobiliários
    - No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: true
  orientacoes: Contas que registram os ajustes a valor presente efetuados sobre os ativos financeiros
    no país. Referidos valores serão apropriados ao resultado pelo regime de competência e excluídos do
    Lucro Real. Não devem ser controlados em subcontas, mas na Parte B do Lalur, sendo seu montante adicionado
    ao Lucro Real no mesmo período em a receita ou resultado da operação deva ser tributada (art.4º, Lei
    nº 12.973/2014).
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.05.55
  name: Perdas por Redução ao Valor Recuperável (Impairment)- Valores Mobiliários - No País
  name_raw: (-) Perdas por Redução ao Valor Recuperável (Impairment)- Valores Mobiliários - No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: true
  orientacoes: Contas que registram as perdas incorridas com base em evidências objetivas passadas, mas
    posteriores ao reconhecimento inicial, impactantes no fluxo de caixa futuros estimados desses ativos
    financeiros. Os títulos para negociação não estão sujeitos a teste de “impairment”. Esta conta também
    registra as eventuais reversões, não se admitindo para títulos patrimoniais. Referidos valores deverão
    ser adicionados ao Lucro Real, mantidos na Parte B do Lalur até ocorrência da alienação ou baixa do
    ativo, quando poderão ser excluídos do Lucro Real (art. 32, Lei nº 12.973/2014).
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.05.70
  name: Subconta - Ajuste a Valor Justo - Valores Mobiliários – Não Hedge -No País
  name_raw: Subconta - Ajuste a Valor Justo - Valores Mobiliários – Não Hedge -No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os ajustes a valor justo positivos ou negativos efetuados sobre os
    ativos financeiros no país, inclusive decorrentes apenas de sua mensuração inicial ou efetuados nos
    objetos de hedge de valor justo. Os títulos para negociação e disponíveis para venda devem seguir
    a mensuração pelo valor justo até sua baixa. Referidos valores  deverão ser computados na apuração  Lucro
    Real quando da alienação ou baixa do ativo(arts. 49/50,  Instrução Normativa SRF nº 1.515/2014, cujos
    detalhes sobre a contabilização estão descritos em seu Anexo I,  exemplos 5/6). Apenas no caso da
    conta contábil que registra o ativo consolidar vários itens de mesma natureza, pode-se  utilizar uma
    mesma subconta coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art. 33, §3º, Instrução
    Normativa SRF nº 1.515/2014)
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.05.90
  name: Subconta – Adoção Inicial -  Valores Mobiliários – Não Hedge - No País
  name_raw: Subconta – Adoção Inicial -  Valores Mobiliários – Não Hedge - No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram as diferenças positivas ou negativas, na data da adoção dos efeitos
    da Lei nº 12.973/2014, entre o valor do ativo mensurado de acordo as disposições da Lei nº 6.404/1976
    e o valor mensurado pelos métodos e critérios vigentes em 31/12/2007(arts. 66/67, Lei nº 12.973/2014).
    Conforme disciplinado art. 169, § 9ª, Instrução Normativa SRF nº 1.515/2014, cada subconta de adoção
    inicial deve registrar individualmente a diferença de valor identificada em cada ativo.  Apenas no
    caso da conta contábil que registra o ativo consolidar vários itens de mesma natureza, pode-se  utilizar
    uma mesma subconta coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art. 169, §6º,
    Instrução Normativa SRF nº 1.515/2014)
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
