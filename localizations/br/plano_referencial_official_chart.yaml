- code: 1.01.01.09.01
  name: Títulos para Negociação - Mensurados a Valor Justo por Meio de Resultado (VJPR) - No Exterior
  name_raw: Títulos para Negociação - Mensurados a Valor Justo por Meio de Resultado (VJPR) - No Exterior
  tipo: A
  conta_superior: 1.01.01.09
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, cuja contraparte ou ambiente negocial tenham sede
    ou domicílio no exterior, sobre os quais há a intenção de negociação no curto prazo ou se a mensuração
    pelo valor justo diminuir ou eliminar alguma inconsistência de mensuração de acordo com a gestão financeira
    da empresa (fair value option) e ainda não estejam melhor classificados em outras contas mais específica,
    mesmo que extrapolem o conceito da Lei nº 6.385/76. Os derivativos utilizados como hedge devem ser
    registrados no grupo 1.01.01.10.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.09.02
  name: Títulos Disponíveis para Venda - No Exterior
  name_raw: Títulos Disponíveis para Venda - No Exterior
  tipo: A
  conta_superior: 1.01.01.09
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, cuja contraparte ou ambiente negocial tenham sede
    ou domicílio no exterior, sobre os quais não há definição de quando nem quais condições vai negociá-los
    e ainda não estejam melhor classificados em outras contas mais específica, mesmo que extrapolem o
    conceito da Lei nº 6.385/76. Contrapartida das alterações no seu valor justo, bem como custos de transação,
    devem ser reconhecidos no Patrimônio Líquido até a realização do ativo.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.09.03
  name: Títulos Mantidos até o Vencimento - No Exterior
  name_raw: Títulos Mantidos até o Vencimento - No Exterior
  tipo: A
  conta_superior: 1.01.01.09
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, cuja contraparte ou ambiente negocial tenham sede
    ou domicílio no exterior, não derivativos, com pagamentos fixos ou determináveis e com vencimento
    fixo, para os quais há a intenção e a capacidade de se manter até o vencimento e ainda não estejam
    melhor classificados em outras contas mais específica, mesmo que extrapolem o conceito da Lei nº 6.385/76.
    Esses títulos são avaliados pelo método de custo amortizado, com os custos de transação capitalizados
    ao valor do ativo. Ações e outros títulos patrimoniais não devem receber esta classificação. Títulos
    públicos e de renda fixa constumam receber esta classificação.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.09.10
  name: Debêntures emitidas por Partes Relacionadas - No Exterior
  name_raw: Debêntures emitidas por Partes Relacionadas - No Exterior
  tipo: A
  conta_superior: 1.01.01.09
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram as debêntures emitidas por empresas com sede no exterior, relacionadas
    com a declarante conforme conceito definido no CPC 05(R1), itens 09 a 12, independente da base de
    mensuração utilizada ou se tais Valores Mobiliários poderiam ser classificáveis em outras contas mais
    genéricas de ativos financeiros.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
