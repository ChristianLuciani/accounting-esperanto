- code: 3.11.01.09.01.01
  name: Variações Cambiais Passivas
  name_raw: (-) Variações Cambiais Passivas
  tipo: A
  conta_superior: 3.11.01.09.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as perdas monetárias passivas resultantes da atualização dos direitos
    de créditos e das obrigações, calculadas com base nas variações nas taxas de câmbio (Lei nº 9.069,
    de 1995, art. 52, e Lei nº 9.249, de 1995, art. 8º).

    Incluir, nesta linha, a variação cambial passiva correspondente:

    a) à atualização das obrigações e dos créditos em moeda estrangeira, registrada em qualquer data e
    apurada no encerramento do período de apuração em função da taxa de câmbio vigente;

    b) às operações com moeda estrangeira e conversão de obrigações para moeda nacional, ou novação dessas
    obrigações, ou sua extinção, total ou parcial, em virtude de capitalização, dação em pagamento, compensação,
    ou qualquer outro modo, desde que observadas as condições fixadas pelo Banco Central do Brasil.

    Atenção: As variações cambiais passivas decorrentes dos direitos de crédito e de obrigações, em função
    da taxa de câmbio, são consideradas como despesa financeira, inclusive para fins de cálculo do lucro
    da exploração (Lei nº 9.718, art. 9º c/c art. 17).'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.11.01.09.01.02
  name: Perdas Incorridas no Mercado de Renda Variável, exceto Day-Trade
  name_raw: (-) Perdas Incorridas no Mercado de Renda Variável, exceto Day-Trade
  tipo: A
  conta_superior: 3.11.01.09.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: "Contas que registram:\na) o somatório das perdas incorridas, em cada mês do período de\
    \ apuração, em operações realizadas nas bolsas de valores, de mercadorias, de futuros e assemelhadas,\
    \ existentes no País;\nb) as perdas incorridas nas alienações, fora de bolsa, de ouro, ativo financeiro,\
    \ e de participações societárias, exceto as alienações de participações societárias permanentes em\
    \ sociedades coligadas e controladas e de participações societárias que permanecerem no ativo da pessoa\
    \ jurídica até o término do ano-calendário seguinte ao de suas aquisições; e\nc) as perdas em operações\
    \ de swap e no resgate de quota de fundo de investimento que mantenha, no mínimo, 67% (sessenta e\
    \ sete por cento) de ações negociadas no mercado à vista de bolsa de valores ou entidade assemelhada\
    \ (Lei nº 9.532, de 1997, art. 28, alterado pela MP nº 1.636, de 1998, art. 2º, e reedições).\nSão\
    \ consideradas assemelhadas às bolsas de valores, de mercadorias e de futuros as entidades cujo objeto\
    \ social seja análogo ao das referidas bolsas e que funcionem sob a supervisão e fiscalização da Comissão\
    \ de Valores Mobiliários (CVM). Atenção:\n1) As perdas apuradas nas operações de renda variável, exceto\
    \ day-trade, somente são dedutíveis na determinação do lucro real até o limite dos ganhos auferidos\
    \ em operações de mesma natureza, observado o disposto nos itens 3 a 5. As perdas não deduzidas em\
    \ um período de apuração podem sê-lo nos períodos de apuração subsequentes. A parcela não dedutível\
    \ no período de apuração deve ser controlada na Parte B do Lalur.\n2) A partir de 1º de janeiro de\
    \ 2000, as perdas apuradas em operações, exceto day-trade, no mercado à vista de ações somente são\
    \ compensadas com os ganhos líquidos auferidos em operações, exceto day-trade, realizadas exclusivamente\
    \ nesse mercado. \n3) O saldo de perdas decorrentes de operações, exceto day-trade, existente em 31\
    \ de dezembro de 1999 pode ser compensado com os ganhos líquidos auferidos:\na) no mercado à vista\
    \ de ações, se as perdas decorreram de operações, exceto day-trade, realizadas exclusivamente nesse\
    \ mercado; e\nb) em quaisquer mercados, se as perdas decorreram de operações, exceto day-trade, realizadas\
    \ em mercados diversificados.\n4) As limitações de realização de perdas, de que tratam as instruções\
    \ de preenchimento desta linha, não se aplicam às pessoas jurídicas citadas no inciso I do art. 35\
    \ da IN SRF nº 25, de 6 de março de 2001, e às operações de swap utilizadas como cobertura (hedge)."
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.11.01.09.01.03
  name: Perdas em Operações Day-Trade
  name_raw: (-) Perdas em Operações Day-Trade
  tipo: A
  conta_superior: 3.11.01.09.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram o somatório das perdas diárias apuradas, em cada mês do período de
    apuração, em operações day-trade.

    Não se caracteriza como day-trade o exercício da opção e a venda ou compra do ativo no mercado à vista,
    no mesmo dia.

    Também não se caracterizam como day-trade as operações iniciadas por intermédio de uma instituição
    e encerradas em outra, quando houver a liquidação física mediante movimentação de títulos ou valores
    mobiliários em custódia'
