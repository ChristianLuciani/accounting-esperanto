- code: 3.11.01.05.01.47
  name: Doações e Subvenções para Investimentos
  name_raw: Doações e Subvenções para Investimentos
  tipo: A
  conta_superior: 3.11.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
  orientacoes: "Contas que registras as subvenções para investimento recebidas, inclusive mediante isenção\
    \ ou redução de impostos concedidas como estímulo à implantação ou expansão de empreendimentos econômicos,\
    \ e as doações recebidas do Poder Público.\nAtenção:\n1) A pessoa jurídica poderá excluir o valor\
    \ decorrente de doações ou subvenções governamentais para investimentos, reconhecido no exercício,\
    \ para fins de apuração do lucro real; caso mantenha em reserva de lucros a que se refere o art. 195-A\
    \ da Lei nº 6.404, de 1976, a parcela decorrente de doações ou subvenções governamentais, apurada\
    \ até o limite do lucro líquido do exercício.\n2) As doações e subvenções serão tributadas caso seja\
    \ dada destinação diversa da prevista no item 1, inclusive nas hipóteses de: \na) capitalização do\
    \ valor e posterior restituição de capital aos sócios ou ao titular, mediante redução do capital social,\
    \ hipótese em que a base para a incidência será o valor restituído, limitado ao valor total das exclusões\
    \ decorrentes de doações ou subvenções governamentais para investimentos; \nb) restituição de capital\
    \ aos sócios ou ao titular, mediante redução do capital social, nos 5 (cinco) anos anteriores à data\
    \ da doação ou da subvenção, com posterior capitalização do valor da doação ou da subvenção, hipótese\
    \ em que a base para a incidência será o valor restituído, limitado ao valor total das exclusões decorrentes\
    \ de doações ou de subvenções governamentais para investimentos; ou \nc) integração à base de cálculo\
    \ dos dividendos obrigatórios. \n3) Se, no período base em que ocorrer a exclusão, a pessoa jurídica\
    \ apurar prejuízo contábil ou lucro líquido contábil inferior à parcela decorrente de doações e subvenções\
    \ governamentais, e neste caso não puder ser constituída como parcela de lucros nos termos do item\
    \ 1 acima, esta deverá ocorrer nos exercícios subsequentes."
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
