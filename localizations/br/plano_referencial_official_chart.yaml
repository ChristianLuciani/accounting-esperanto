- code: 3.11.01.07.01.01
  name: Remuneração a Dirigentes e a Conselho de Administração
  name_raw: (-) Remuneração a Dirigentes e a Conselho de Administração
  tipo: A
  conta_superior: 3.11.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: "Contas que registram a despesa incorrida relativa à remuneração mensal e fixa atribuída\
    \ ao titular de firma individual, aos sócios, diretores e administradores de sociedades, ou aos representantes\
    \ legais de sociedades estrangeiras, as despesas incorridas com os salários indiretos concedidos pela\
    \ empresa a administradores, diretores, gerentes e seus assessores (PN Cosit nº 11, de 1992), e o\
    \ valor referente às remunerações atribuídas aos membros do conselho fiscal ou consultivo.\nAtenção:\n\
    1) Os valores das gratificações aos dirigentes que estejam ligados à área industrial ou de produção\
    \ de serviços devem ser informados nas contas de custos, respectivamente;\n2) O valor de 13º salário\
    \ pago a diretor contratado nos termos da Consolidação das Leis do Trabalho (CLT) é dedutível, desde\
    \ que ele não esteja enquadrado no conceito de sócio, diretor ou administrador estabelecido no PN\
    \ CST nº 48, de 1972.                                                                            \
    \                                                                                                \
    \                                                                                                \
    \                          \n3) As gratificações espontâneas devem ser adicionadas ao Lucro Real."
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.11.01.07.01.02
  name: Ordenados, Salários, Gratificações e Outras Remunerações a Empregados
  name_raw: (-) Ordenados, Salários, Gratificações e Outras Remunerações a Empregados
  tipo: A
  conta_superior: 3.11.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as despesas com ordenados, salários, gratificações e outras despesas
    com empregados, tais como: comissões, moradia, seguro de vida, contribuições pagas ao plano PAIT,
    despesas com programa de previdência privada, contribuições para os Fundos de Aposentadoria Programada
    Individual (Fali), e outras de caráter remuneratório.

    Atenção:

    1) As despesas correspondentes a salários, ordenados, gratificações e outras remunerações referentes
    à área de saúde, tais como assistência médica, odontológica e farmacêutica, devem ser indicadas na
    conta "Assistência, médica, odontológica e farmacêutica a empregados".

    2) Não deve ser informado nesta linha o valor referente às participações dos empregados no lucro da
    pessoa jurídica. Esse valor deve ser informado na conta "Participações de empregados".

    3) O valor das contribuições não compulsórias, destinadas a custear benefícios complementares assemelhados
    aos da previdência social, instituídos em favor dos empregados e dirigentes da pessoa jurídica, e
    para os Fundos de Aposentadoria Programada Individual (Fali) cujo ônus seja da pessoa jurídica, que
    exceder, no período de apuração, a vinte por cento do total dos salários dos empregados e da remuneração
    dos dirigentes da empresa, vinculados ao referido plano, deve ser adicionado ao Lucro Real.

    4) As demais contribuições não compulsórias, exceto as destinadas a custear seguros e planos de saúde,
    devem ser adicionados ao Lucro Real".'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
