  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram os juros pagos ou creditados por fonte situada no Brasil à pessoa
    física ou jurídica, vinculada nos termos do art. 23 da Lei nº 9.430, de 27 de dezembro de 1996, residente
    ou domiciliada no exterior, não constituída em país ou dependência com tributação favorecida ou sob
    regime fiscal privilegiado, observado o art. 24 da Lei nº 12.249, de 11 de junho de 2010.

    Indicar também, os juros pagos ou creditados por fonte situada no Brasil à pessoa física ou jurídica
    residente, domiciliada ou constituída no exterior, em país ou dependência com tributação favorecida
    ou sob regime fiscal privilegiado, nos termos dos arts. 24 e 24-A da Lei nº 9.430, de 27 de dezembro
    de 1996, observado o art. 25 da Lei nº 12.249, de 2010.'
