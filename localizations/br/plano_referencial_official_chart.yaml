- code: 1.02.05.01.01
  name: Marcas
  name_raw: Marcas
  tipo: A
  conta_superior: 1.02.05.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os custos de aquisição e registro de marcas, bem como desembolso a
    terceiros por contrato de uso. Nos termos do CPC 04, ativo intangível é um ativo não monetário identificável
    sem substância física, ou seja, regra geral, para registrá-los no ativo necessário que sejam  identificáveis,
    controlados e geradores de benefícios econômicos futuros. Conforme itens 63/64, CPC 04, os gastos
    incorridos com marcas, títulos de publicação, lista de clientes e outros itens similares, quando gerados
    internamente, não devem ser reconhecidos como ativos intangíveis. Após o seu reconhecimento inicial,
    um ativo intangível deve ser apresentado ao custo, menos a eventual amortização acumulada e a perda
    acumulada do valor recuperável. Em se definindo sua vida útil, este bem deve ser amortizado por este
    prazo, o mesmo não ocorrendo para aqueles com vida útil indefinida, ou seja, com base na análise de
    todos os fatores relevantes, não existe um limite previsível para o período durante o qual o ativo
    deverá gerar fluxos de caixa líquidos positivos para a pessoa jurídica.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
