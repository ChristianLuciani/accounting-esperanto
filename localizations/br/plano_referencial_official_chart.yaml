  conta_superior: 1.01.02.02
  nivel: 5
  natureza: 1
  is_contra: true
  orientacoes: Contas que registram os ajustes a valor presente efetuados sobre os ativos financeiros
    representativos das operações de venda à prazo, sua contrapartida não deve ser excluída da Receita
    Bruta do período, mas compor uma dedução, art. 12, Decreto-Lei nº 1.598/1977(conta referencial 3.01.01.01.02.10).
    Referidos valores serão apropriados ao resultado pelo regime de competência e excluídos do Lucro Real.
    Não devem ser controlados em subcontas, mas na Parte B do e-Lalur, sendo seu montante adicionado ao
    Lucro Real no mesmo período em a receita ou resultado da operação deva ser tributada (art.4º, Lei
    nº 12.973/2014).
