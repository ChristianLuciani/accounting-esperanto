  tipo: A
  conta_superior: 3.11.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
  orientacoes: 'Esta conta é utilizada pelas pessoas jurídicas que forem sócias ostensivas de sociedades
    em conta de participação, para a indicação:

    a) de lucros derivados de participação em SCP, avaliadas pelo custo de aquisição;

    b) dos ganhos por ajustes no valor de participação em SCP, avaliadas pelo método da equivalência patrimonial.

    Os lucros recebidos de investimento em SCP, avaliado pelo custo de aquisição, ou a contrapartida do
    ajuste do investimento ao valor do patrimônio líquido da SCP, no caso de investimento avaliado por
    esse método, podem ser excluídos na determinação do lucro real dos sócios, pessoas jurídicas, das
    referidas sociedades (Decreto nº 3.000, de 1999, art. 149).'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.11.01.05.01.08
  name: Rendimentos e Ganhos de Capital Auferidos no Exterior
  name_raw: Rendimentos e Ganhos de Capital Auferidos no Exterior
  tipo: A
  conta_superior: 3.11.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
  orientacoes: 'Contas que registram os rendimentos e ganhos de capital auferidos no exterior diretamente
    pela pessoa jurídica domiciliada no Brasil, pelos seus valores antes de descontado o tributo pago
    no país de origem. Esses valores podem, no caso de apuração trimestral do imposto, ser excluídos na
    apuração do lucro real do 1º aos 3º trimestres, devendo ser adicionados ao lucro líquido na apuração
    do lucro real referente ao 4º trimestre.

    Atenção: Os ganhos de capital referentes a alienações de bens e direitos do ativo não-circulante,
    exceto os classificáveis no ativo realizável a longo prazo, situados no exterior devem ser informados
    em outras receitas.'
