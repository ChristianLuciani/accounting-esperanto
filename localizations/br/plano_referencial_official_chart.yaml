- code: 1.02.02.01.56
  name: Perdas por Redução ao Valor Recuperável (Impairment) do Goodwill em Investimentos - no País
  name_raw: (-) Perdas por Redução ao Valor Recuperável (Impairment) do Goodwill em Investimentos - no
    País
  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
  natureza: 1
  is_contra: true
  orientacoes: Contas que registram as perdas estimadas com base em evidências objetivas  que demonstrem
    a não recuperabilidade do valor contábil do goodwill em participações societárias no país. Estes valores
    não estão sujeitos a reversão, conforme item 124, CPC 01. Referidos valores deverão ser adicionados
    ao Lucro Real, mantidos na Parte B do e-Lalur até ocorrência da alienação ou baixa da participação
    societária, quando poderão ser excluídos do Lucro Real (art. 25, Decreto-Lei nº 1.598/1977) . Esta
    conta não registra impairment sobre goodwill gerado em outras modalidades de combinações de negócio
    previsas no CPC 15,  bem como, em eventos societários de incorporação, fusão e cisão, cujos valores
    devem ser registrados em conta de intangível(1.02.05.01.56).
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.01.60
  name: Subconta - Ajuste a Valor Justo (AVJ) Reflexo - Ganho ou Perda na Investida
  name_raw: Subconta - Ajuste a Valor Justo (AVJ) Reflexo - Ganho ou Perda na Investida
  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os ganhos ou perdas na mensuração de participação societária, no país,
    avaliada pelo método da equivalência patrimonial, decorrentes de alterações do valor justo de ativos
    ou passivos na investida. Se a investidora possuir saldos de mais-valia ou menos-valia  derivados
    destes mesmos bens, deve primeiro baixar estes valores(art. 24-A/24-B, Decreto-Lei nº 1.598/1977).
    Somente se o AVJ for referente a outros bens da investida, ou já tenha ocorrido  exaurimento dos correlatos
    mais ou menos-valia, então passará a registrar estes ganhos ou perdas reflexas em subconta na investidora.
    Caso bem que sofra o AVJ for único, a descrição da subconta deve identificá-lo, em sendo vários, pode
    utilizar uma mesma subconta coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art.
    33, §4º, Instrução Normativa SRF nº 1.515/2014)
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.01.65
  name: Subconta - Ajuste a Valor Justo (AVJ) de Subscrição de Capital - Ganho ou Perda de Capital
  name_raw: Subconta - Ajuste a Valor Justo (AVJ) de Subscrição de Capital - Ganho ou Perda de Capital
  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os ganhos ou perdas em bens do ativo, inclusive participações societárias,  quando
    avaliados a valor justo, na transmissão para subscrição de capital social, ou de valores mobiliários
    em outra empresa.  Estes valores devem ser excluídos ou adicionados, respectivamente, no lucro real
    do exercício em que ocorrer a subscrição, devendo ocorrer a posterior adição ou exclusão conforme
    hipóteses de  realização disciplinadas nos arts.17/18, Lei nº 12.973/2014. Caso bem que sofra o AVJ
    for único, a descrição da subconta deve identificá-lo, em sendo vários, pode utilizar uma mesma subconta
    coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art. 33, §4º, Instrução Normativa
    SRF nº 1.515/2014). Excepcionalmente, recebe esta classificação ainda que a investida ou emitente
    dos valores mobiliários tenha sede ou domicílio no exterior.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.01.75
  name: Subconta - Ajuste a Valor Presente (AVP) de Participação Societária
  name_raw: (-) Subconta - Ajuste a Valor Presente (AVP) de Participação Societária
  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
  natureza: 1
  is_contra: true
  orientacoes: Contas que registram contrapartidas dos  ajustes a valor presente efetuados sobre os passivos
    decorrentes de compras a prazo de participações societárias, no país, avaliadas pelo método da equivalência
    patrimonial. Referidos valores serão apropriados ao resultado pelo regime de competência e adicionados
    ao Lucro Real. Concomitante controle ocorrerá nesta subconta até realização da participação, quando
    valor do AVP poderá ser excluído do Lucro Real do período(art.5º, Lei nº 12.973/2014 c/c art. 39 ,
    Instrução Normativa SRF nº 1.515/2014).
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
