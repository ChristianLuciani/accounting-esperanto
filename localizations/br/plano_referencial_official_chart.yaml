  name: Títulos para Negociação - No País - Longo Prazo
  name_raw: Títulos para Negociação - No País - Longo Prazo
  tipo: A
  conta_superior: 1.02.01.02
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, utilizados em operações de hedge ou não, cuja
    contraparte ou ambiente negocial tenham sede ou domicílio no país, sobre os quais há a intenção de
    negociação no curto prazo ou se a mensuração pelo valor justo diminuir ou eliminar alguma inconsistência
    de mensuração de acordo com a gestão financeira da empresa (fair value option) e ainda não estejam
    melhor classificados em outras contas mais específica, mesmo que extrapolem o conceito da Lei nº 6.385/76
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.01.02.02
  name: Títulos Disponíveis para Venda - No País - Longo Prazo
  name_raw: Títulos Disponíveis para Venda - No País - Longo Prazo
  tipo: A
  conta_superior: 1.02.01.02
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, utilizados em operações de hedge ou não, cuja
    contraparte ou ambiente negocial tenham sede ou domicílio no país, sobre os quais não há definição
    de quando nem quais condições vai negociá-los e ainda não estejam melhor classificados em outras contas
    mais específica, mesmo que extrapolem o conceito da Lei nº 6.385/76. Contrapartida das alterações
    no seu valor justo, bem como custos de transação, devem ser reconhecidos no Patrimônio Líquido até
    a realização do ativo.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
