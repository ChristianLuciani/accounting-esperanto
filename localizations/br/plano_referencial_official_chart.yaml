- code: 1.02.05.01.03
  name: Direitos de Exploração de Serviços Públicos
  name_raw: Direitos de Exploração de Serviços Públicos
  tipo: A
  conta_superior: 1.02.05.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram o ativo intangível representativo do direito de exploração de serviços
    públicos, é constituído durante a fase de contrução à medida em que recebe o direito(autorização)
    de cobrar os usuários dos serviços públicos( item 17, nos termos do ICPC 01(R1)). Se os serviços de
    construção do concessionário são pagos parte em ativo financeiro e parte em ativo intangível, é necessário
    contabilizar cada componente da remuneração separadamente. A remuneração recebida ou a receber de
    ambos os componentes deve ser inicialmente registrada pelo seu valor justo recebido ou a receber.
    Importante ressaltar que a natureza da remuneração deve ser determinada de acordo com os termos do
    contrato e, quando houver, legislação aplicável. Em termos gerais, este intangível   é formado ao
    longo da fase de construção pela contrapartida das parcelas da receita de construção de cada contrato(conta
    3.01.01.01.01.20), reconhecidas pelo método da porcentagem completada (itens 25/26, CPC 17(R1)). Nos
    termos do CPC 20, os custos de empréstimos atribuíveis ao contrato de concessão devem ser capitalizados
    durante a fase de construção, integrando o custo do intangível. Regras especiais devem ser aplicadas
    às concessões onerosas-direito de outorga, conforme OCPC 05.  Referido intangível deve ser amortizado
    dentro do prazo da concessão. Para fins fiscais, o resultado apurado durante a fase construção  deverá
    ser excluído do Lucro Real, controlado na parte B do eLalur, para ser adicionado na proporção em que
    o ativo intangível for realizado(art. 82, Instrução Normativa SRF nº 1.515/2014).
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
