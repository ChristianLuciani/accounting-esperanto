metadata:
  jurisdiction: br
  authority: Receita Federal do Brasil (RFB) / SERPRO -- SPED (Sistema Público de Escrituração Digital)
  source_url: http://sped.rfb.gov.br/arquivo/download/8002
  source_document: Tabelas Dinâmicas e Planos de Contas Referenciais - Leiaute 12 da ECF (Escrituração
    Contábil Fiscal), Anexo ao Ato Declaratório Executivo Cofis nº 02/2026, atualização de 28/05/2026
  profile: PJ do Lucro Real - PJ em Geral (general commercial/industrial entity under the Lucro Real tax
    regime) -- registers L100A (Contas Patrimoniais / balance sheet) and L300A (Contas de Resultado /
    P&L). L100B/L100C and L300B/L300C (financial institutions, insurers) and the P100A/P300 Lucro Presumido
    set are out of scope for this round.
  extraction_command: python3 scripts/coa_fidelity/parse_br_plano_referencial.py --input Tabelas_ECF_Leiaute12.xlsx
    --source-url <URL> --out <OUT>
  parser: scripts/coa_fidelity/parse_br_plano_referencial.py
  total_accounts: 1123
  sheets:
    L100A: 732
    L300A: 391
  duplicate_codes: null
  natureza_legend:
    1: Ativo
    2: Passivo
    3: Patrimônio Líquido
    4: Resultado
  note: Verbatim transcription of the primary-source official Plano de Contas Referencial (RFB SPED ECF
    Leiaute 12, L100A + L300A sheets). No Kontablo UUID classification here by design -- that mapping
    is a separate, human-reviewable step (map_official_chart.py) so a parsing bug can never silently corrupt
    the semantic mapping. TIPO ('S'=Sintética/header, 'A'=Analítica/leaf) and CONTA SUPERIOR (explicit
    parent code) are carried through verbatim from the source -- Brazil's own data already distinguishes
    header/aggregate rows from postable leaves authoritatively, unlike EC/MX where this had to be inferred
    from a prefix heuristic. Account names beginning with a literal '(-)' marker in the source are contra-accounts
    (allowances, accumulated depreciation/amortization/exhaustion, sales/purchase deductions, impairment
    losses); is_contra=true carries this forward and name has the '(-)' prefix stripped (name_raw keeps
    the original).
