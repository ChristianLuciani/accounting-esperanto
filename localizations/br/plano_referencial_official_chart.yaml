- code: 1.02.02.01.10
  name: Goodwill em Investimentos - no País
  name_raw: Goodwill em Investimentos - no País
  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram o ágio por expectativa de rentabilidade futura, referente apenas a
    aquisições de participações societárias no país, apurado segundo regramentos societários,  e tratado
    no art. 20, inc.III, Decreto-Lei nº 1.598/1977.  Por não possuírem prazo definido, não estão sujeitos
    à amortização societária, apenas redução por impairment, cujo valor  será adicionado ao Lucro Real
    do período(art.25, Lei nº 12.973/2014) e posteriormente excluído,  quando da alienação da participação,
    para fins de cálculo do ganho ou perda de capital(art. 33, inc. II,  Decreto-Lei nº 1.598/1977 ).
    O saldo original apurado na data da aquisição societária deve ser registrado na Parte B do eLalur,
    somente podendo vir a ser excluído do Lucro Real em parcelas mensais, nos termos do  art. 22 da Lei
    nº 12.973/2014.  Esta conta não registra goodwill gerado em outras modalidades de combinações de negócio
    previsas no CPC 15,  bem como, em eventos societários de incorporação, fusão e cisão, cujos valores
    devem ser registrados em conta de intangível(1.02.05.01.20).  Merecem especial atenção os valores
    de ágio gerados em aquisições de participação societárias no país, ocorridas ou iniciadas até 31/12/2014,
    caso ainda calculado pela metodologia preceitua na  redação original do art. 20, Decreto-Lei nº 1.598/1977,
    não mais vigente, contudo,  aplicável segundo regramento transitório previsto no art. 65,  Lei 12.973/2014.  Estes  valores
    devem ser controlados apenas extracontabilmente em memória de cálculo encaminhada para ECF no registro
    Y800(art. 107, da Instrução Normativa SRF nº 1.515/2014). Caso as condições necessárias para início
    da amortização fiscal via eLalur não venham a se materializar nos termos do art.106 da mesma Instrução
    Normativa, eventual goodwill registrado contabilmente deve seguir regra aplicável aos demais casos.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.01.11
  name: Mais Valia em Investimentos - no País
  name_raw: Mais Valia em Investimentos - no País
  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram a mais-valia, referente  a aquisições de participações societárias
    no país, apurada segundo regramentos societários,  e tratada no art. 20, inc.II, Decreto-Lei nº 1.598/1977.
    A amortização societária ocorrerá, conforme bem ou direito for realizado na investida, devendo valor
    ser adicionado ao Lucro Real do período(art. 25, Decreto-Lei nº 1.598/1977) e posteriormente excluído,  quando
    da alienação da participação, para fins de cálculo do ganho ou perda de capital(art. 33, inc. II,  Decreto-Lei
    nº 1.598/1977 ). O saldo original apurado na data da aquisição societária deve ser registrado na Parte
    B do eLalur, somente  virndo a ser considerado integrante do custo do bem ou direito que lhe deu causa,
    ou ser excluído do Lucro Real em parcelas mensais, nos termos do  art. 20 da Lei nº 12.973/2014. No
    caso do referido bem ou direito e a  mais-valia correlata fundirem-se em um mesmo patrimônio, o saldo
    da mais-valia registrado na investidora na data do evento societário(p.ex. incorporação) integrará
    o custo do bem ou direito na sucessora. Ademais,  eventual diferença a menor em relação ao saldo na
    data da aquisição societária(registrado na parte B), poderá ser excluído do Lucro Real do período
    em que o bem ou direito for sendo realizado na sucessora(p.ex. depreciação). Contudo, se determinado  bem
    ou direito que lhe deu causa não estiver presente no patrimônio da investida na data do evento societário,
    o correspondente valor de mais-valia deve ser baixado do saldo original registrado na Parte B, sem
    afetar o Lucro Real.(art. 100, inc.III, c, Instrução Normativa SRF nº 1.515/2014).
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.01.12
  name: Menos Valia em Investimentos - no País
  name_raw: (-) Menos Valia em Investimentos - no País
  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
