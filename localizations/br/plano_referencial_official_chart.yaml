    posteriores ao reconhecimento inicial, impactantes no fluxo de caixa futuros estimados desses ativos
    financeiros. Os títulos para negociação não estão sujeitos a teste de “impairment”. Esta conta também
    registra as eventuais reversões, não se admitindo para títulos patrimoniais. Referidos valores deverão
    ser adicionados ao Lucro Real, mantidos na Parte B do Lalur até ocorrência da alienação ou baixa do
    ativo, quando poderão ser excluídos do Lucro Real (art. 32, Lei nº 12.973/2014), sem prejuízo observância
    aos arts.  9º a 12 da Instrução Normativa SRF nº 213/2002.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
