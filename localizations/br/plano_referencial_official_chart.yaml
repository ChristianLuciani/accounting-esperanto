    no Exterior
  tipo: A
  conta_superior: 1.02.02.02
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os ganhos ou perdas em bens do ativo, inclusive participações societárias,  quando
    avaliados a valor justo, na transmissão para subscrição de capital social, ou de valores mobiliários
    em outra empresa.  Estes valores devem ser excluídos ou adicionados, respectivamente, no lucro real
    do exercício em que ocorrer a subscrição, devendo ocorrer a posterior adição ou exclusão conforme
    hipóteses de  realização disciplinadas nos arts.17/18, Lei nº 12.973/2014. Caso bem que sofra o AVJ
    for único, a descrição da subconta deve identificá-lo, em sendo vários, pode utilizar uma mesma subconta
    coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art. 33, §4º, Instrução Normativa
    SRF nº 1.515/2014). Excepcionalmente, recebe esta classificação ainda que a investida ou emitente
    dos valores mobiliários tenha sede ou domicílio no exterior.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
