- code: 3.01.01.07.01.08
  name: Doações e Patrocínios de Caráter Cultural e Artístico (Lei no 8.313/1991)
  name_raw: (-) Doações e Patrocínios de Caráter Cultural e Artístico (Lei no 8.313/1991)
  tipo: A
  conta_superior: 3.01.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: "Contas que registram as doações e patrocínios efetuados no período de apuração em favor\
    \ de projetos culturais previamente aprovados pelo Ministério da Cultura ou pela Agência Nacional\
    \ do Cinema (Ancine), observada a legislação de concessão dos projetos. \n\nA pessoa jurídica que\
    \ tiver efetuado doação ou patrocínio a projeto aprovado nos termos dos arts. 25 e 26 da Lei nº 8.313,\
    \ de 23 de dezembro de 1991, ou nos termos desses dois artigos combinados com o § 6º do art. 39 da\
    \ Medida Provisória nº 2.228-1, de 6 de agosto de 2001, cujos projetos são produzidos com os recursos\
    \ de que trata o inciso X desse mesmo art. 39, pode deduzir o valor relativo às doações e/ou patrocínios\
    \ como despesa operacional.\n\nA pessoa jurídica que tiver efetuado doação ou patrocínio a projeto\
    \ aprovado nos termos do art.18 da Lei nº 8.313, de 1991, com alterações promovidas pelo art. 1º da\
    \ Lei nº 9.874, de 23 de novembro de 1999, e pelo art. 53 da MP nº 2.228-1, de 2001, com a redação\
    \ dada pela Lei nº 10.454, de 2002, ou nos termos desses artigos combinados com o § 6º do art. 39\
    \ da Medida Provisória nº 2.228-1, de 6 de agosto de 2001, não pode efetuar qualquer dedução do valor\
    \ correspondente às doações ou patrocínios como despesa operacional. Esse valor deve ser adicionado\
    \ ao Lucro Real.\n\nAtenção: Somente podem usufruir os benefícios fiscais referidos nesta linha os\
    \ incentivadores que obedecerem, para suas doações ou patrocínios, o período definido pelas portarias\
    \ editadas pelo MinC ou Ancine, publicadas no Diário Oficial da União, para homologação dos projetos\
    \ beneficiários."
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.01.01.07.01.09
  name: Operações de Aquisição de Vale Cultura (Lei no 12.761/2012, art. 10).
  name_raw: (-) Operações de Aquisição de Vale Cultura (Lei no 12.761/2012, art. 10).
  tipo: A
  conta_superior: 3.01.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram o total do valor despendido no período de apuração a título de aquisição
    do vale-cultura.

    O limite de dedução no percentual de um por cento será considerado isoladamente e não se submeterá
    a limite conjunto com outras deduções do imposto a título de incentivo. O valor excedente ao limite
    de dedução não poderá ser deduzido do imposto em períodos de apuração posteriores.

    A pessoa jurídica beneficiária:

    a) poderá deduzir o valor despendido a título de aquisição do vale-cultura como despesa operacional
    para fins de apuração do IRPJ; e

    b) deverá adicionar o valor deduzido como despesa operacional, para fins de apuração da base de cálculo
    da CSLL.'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.01.01.07.01.10
  name: Doações a Instituições de Ensino e Pesquisa (Lei nº 9.249/1995, art.13, § 2º)
  name_raw: (-) Doações a Instituições de Ensino e Pesquisa (Lei nº 9.249/1995, art.13, § 2º)
  tipo: A
  conta_superior: 3.01.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as doações efetuadas às instituições de ensino e pesquisa cuja criação
    tenha sido autorizada por lei federal e que preencham os requisitos dos incisos I e II do art. 213
    da Constituição Federal, de 1988, que são:

    a) comprovação de finalidade não-lucrativa e aplicação dos excedentes financeiros em educação;

    b) assegurar a destinação do seu patrimônio a outra escola comunitária, filantrópica ou confessional,
    ou ao Poder Público, no caso de encerramento de suas atividades.

    A sua dedutibilidade está limitada a 1,5% (um e meio por cento) do lucro operacional, antes de computada
    esta dedução e a das doações a entidades civis.'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.01.01.07.01.11
  name: Doações a Entidades Civis
  name_raw: (-) Doações a Entidades Civis
  tipo: A
  conta_superior: 3.01.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as doações efetuadas a:

    a) entidades civis, legalmente constituídas no Brasil, sem fins lucrativos, que prestem serviços gratuitos
    em benefício de empregados da pessoa jurídica doadora, e respectivos dependentes, ou em benefício
    da comunidade na qual atuem; e

    b) Organizações da Sociedade Civil de Interesse Público (OSCIP), qualificadas segundo as normas estabelecidas
    na Lei nº 9.790, de 23 de março de 1999.

    Para fins de dedução na apuração do lucro real, as referidas doações estão limitadas a 2% (dois por
    cento) do lucro operacional da pessoa jurídica, antes de computadas essas deduções, observadas as
    seguintes regras:

    a) as doações, quando em dinheiro, devem ser feitas mediante crédito em conta corrente bancária diretamente
    em nome da entidade beneficiária;

    b) a pessoa jurídica doadora deve manter em arquivo, à disposição da fiscalização, declaração, segundo
    modelo aprovado pela IN SRF nº 87, de 31 de dezembro de 1996, fornecida pela entidade beneficiária,
    em que está se compromete a aplicar integralmente os recursos recebidos na realização de seus objetivos
    sociais, com identificação da pessoa física responsável pelo seu cumprimento, e a não distribuir lucros,
    bonificações ou vantagens a dirigentes, mantenedores ou associados, sob nenhuma forma ou pretexto
    (Lei nº 9.249, de 1995, art. 13, § 2º, inciso III, alínea b);

    Atenção:

    1) A condição estabelecida no item b não alcança a hipótese de remuneração de dirigente em decorrência
    de vínculo empregatício, pelas Organizações da Sociedade Civil de Interesse Público (OSCIP), qualificadas
    segundo as normas estabelecidas na Lei nº 9.790, de 1999, e pelas Organizações Sociais (OS), qualificadas
    consoante os dispositivos da Lei nº 9.637, de 15 de maio de 1998.

    2) O disposto no item anterior aplica-se somente à remuneração não superior, em seu valor bruto, ao
    limite estabelecido para a remuneração de servidores do Poder Executivo Federal.

    c) a entidade civil beneficiária deve ser reconhecida de utilidade pública por ato formal de órgão
    competente da União.

    Atenção: O disposto neste item não se aplica às OSCIP.

    d) a dedutibilidade fica condicionada a que a entidade beneficiária tenha sua condição de utilidade
    pública ou de OSCIP renovada anualmente pelo órgão competente da União, mediante ato formal.

    Atenção: Essa renovação:

    a) somente será concedida a entidade que comprove, perante o órgão competente da União, ter cumprido,
    no ano-calendário anterior ao do pedido, todas as exigências e condições estabelecidas;

    b) produzirá efeitos para o ano-calendário subsequente ao de sua formalização.

    O valor que exceder o limite permitido deve ser adicionado ao Lucro Real.'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.01.01.07.01.12
  name: Outras Contribuições, Doações e Patrocínios
  name_raw: (-) Outras Contribuições, Doações e Patrocínios
  tipo: A
  conta_superior: 3.01.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as doações feitas, entre outras, aos Fundos controlados pelos Conselhos
    Municipais, Estaduais e Nacional dos Direitos da Criança e do Adolescente e Atividades de Caráter
    Desportivo. O valor dessas doações aos Fundos dos Direitos da Criança e do Adolescente e Atividade
    de Caráter Desportivo não é dedutível como despesa operacional na determinação do lucro real e da
    base de cálculo da contribuição social sobre o lucro líquido, mas pode ser deduzido diretamente do
    imposto devido.

    O valor indicado nesta linha deve, também, ser adicionado ao Lucro Real.

    Atenção:

    1) Os valores das doações e patrocínios de caráter cultural e artístico, das doações a instituições
    de ensino e pesquisa e das doações a entidades civis (Lei nº 9.249, de 1995, art. 13, § 2º), devem
    ser indicados nas respectivas contas.

    2) O valor da contribuição sindical deve ser informado na conta de "Outras Despesas Operacionais".'
