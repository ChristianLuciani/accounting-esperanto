- code: 3.01.01.07.01.02
  name: Ordenados, Salários, Gratificações e Outras Remunerações a Empregados
  name_raw: (-) Ordenados, Salários, Gratificações e Outras Remunerações a Empregados
  tipo: A
  conta_superior: 3.01.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: "Contas que registram as despesas com ordenados, salários, gratificações e outras remunerações\
    \ a empregados, que não possuam contas específicas no registro L300.\nAtenção:\n1) As despesas correspondentes\
    \ a salários, ordenados, gratificações e outras remunerações referentes à área de saúde, tais como\
    \ assistência médica, odontológica e farmacêutica, devem ser indicadas na conta \"Assistência, médica,\
    \ odontológica e farmacêutica a empregados\".\n2) As despesas com Fundo de Aposentadoria Individual\
    \ (FAPI), Plano de Poupança e Investimentos (PAIT) e benefícios previdenciários a empregados devem\
    \ ser indicadas nas contas \"Fundo de Aposentadoria Individual - FAPI\", \"Planos de Poupança e Investimentos\
    \ - PAIT\" e \"Benefícios Previdenciários a Empregados\", respectivamente. \n3) Não deve ser informado\
    \ nesta linha o valor referente às participações dos empregados no lucro da pessoa jurídica. Esse\
    \ valor deve ser informado na conta \"Participações de empregados\".\n4) O valor das contribuições\
    \ não compulsórias, destinadas a custear benefícios complementares assemelhados aos da previdência\
    \ social, instituídos em favor dos empregados e dirigentes da pessoa jurídica, e para os Fundos de\
    \ Aposentadoria Programada Individual (Fapi) cujo ônus seja da pessoa jurídica, que exceder, no período\
    \ de apuração, a vinte por cento do total dos salários dos empregados e da remuneração dos dirigentes\
    \ da empresa, vinculados ao referido plano, deve ser adicionado ao Lucro Real.\n5) As demais contribuições\
    \ não compulsórias, exceto as destinadas a custear seguros e planos de saúde, devem ser adicionados\
    \ ao Lucro Real\"."
