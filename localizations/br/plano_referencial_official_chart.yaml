  conta_superior: 1.02.01.10
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram, nas empresas com atividade rural,  os  ativos biológicos consumíveis
    de origem animal, nos casos em que não seja possível mensurá-los ao valor justo, somente no reconhecimento
    inicial, devido a indisponibilidade de cotação de mercado e as alternativas não são, claramente, confiáveis.
    A pessoa jurídica que tenha mensurado previamente o ativo biológico ao seu valor justo, menos a despesa
    de venda, continuará a mensurá-lo assim até a sua venda. Nos termos do item 44 do CPC 29, seriam aqueles
    passíveis de serem colhidos como produto agrícola ou vendidos como ativos biológicos, como rebanhos
    de animais mantidos para a produção de carne, rebanhos mantidos para a venda, produção de peixe etc.
