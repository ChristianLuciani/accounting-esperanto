- code: 1.01.11.01.01
  name: Ativo Não Circulante Mantido Para Venda
  name_raw: Ativo Não Circulante Mantido Para Venda
  tipo: A
  conta_superior: 1.01.11.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registrem valores de ativos não circulantes mantidos para venda ou destinados
    a ser distribuídos aos sócios. Nos termos do CPC 31, regra geral, devem ser mensurados pelo menor
    entre o valor contábil até então registrado e o valor justo menos as despesas de venda/distribuição.
    Os subsequentes reconhecimentos de depreciações ou amortizações devem cessar enquanto mantidos nesta
    classificação. Caso ativo ou grupo de ativos for adquirido como parte de combinação de negócios e
    já receber esta classificação, deve ser mensurado pelo valor justo menos as despesas de venda. Não
    ocorrendo a venda e não mais presentes os critérios para integrar este grupo, os ativos devem deixá-lo
    mensurados ao valor mais baixo entre seu valor contábil antes desta classificação, ajustados por qualquer
    depreciação ou amortização que deixou de ocorrer durante o prazo desta classificação, e seu montante
    recuperável nesta data.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
