    de venda, continuará a mensurá-lo assim até a sua venda. Nos termos do item 44 do CPC 29, seriam aqueles
    passíveis de serem colhidos como produto agrícola ou vendidos como ativos biológicos, como plantações
    de milho, cana-de-açúcar, soja, árvores para produção de madeira etc. Os produtos agrícolas devem
    receber classificação de estoques.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
