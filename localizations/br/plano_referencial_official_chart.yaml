- code: 3.11.01.05.01.11
  name: Prêmios Recebidos na Emissão de Debêntures
  name_raw: Prêmios Recebidos na Emissão de Debêntures
  tipo: A
  conta_superior: 3.11.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
  orientacoes: "Contas que registram valor dos prêmios recebidos na emissão de debêntures, tais como:\
    \                                                                                           \n1) A\
    \ pessoa jurídica poderá excluir o valor decorrente de prêmios recebidos na emissão de debêntures,\
    \ reconhecido no exercício, para fins de apuração do lucro real; caso mantenha em reserva de lucros\
    \ específica a parcela decorrente de prêmio na emissão de debêntures, apurada até o limite do lucro\
    \ líquido do exercício; \n2) O prêmio na emissão de debêntures será tributado caso seja dada destinação\
    \ diversa da que está prevista no item 1 acima, inclusive nas hipóteses de:\na) capitalização do valor\
    \ e posterior restituição de capital aos sócios ou ao titular, mediante redução do capital social,\
    \ hipótese em que a base para a incidência será o valor restituído, limitado ao valor total das exclusões\
    \ decorrentes de prêmios na emissão de debêntures;\nb) restituição de capital aos sócios ou ao titular,\
    \ mediante redução do capital social, nos 5 (cinco) anos anteriores à data da emissão das debêntures\
    \ com o prêmio, com posterior capitalização do valor do prêmio, hipótese em que a base para a incidência\
    \ será o valor restituído, limitado ao valor total das exclusões decorrentes de prêmios na emissão\
    \ de debêntures; ou\nc) integração à base de cálculo dos dividendos obrigatórios."
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
