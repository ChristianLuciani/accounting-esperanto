- code: 1.02.02.03.70
  name: Subconta - Ajuste a Valor Justo – Propriedades para Investimentos.
  name_raw: Subconta - Ajuste a Valor Justo – Propriedades para Investimentos.
  tipo: A
  conta_superior: 1.02.02.03
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os ajustes a valor justo  positivos ou negativos efetuados sobre propriedades
    para investimento, inclusive decorrentes apenas de sua mensuração inicial, sendo neste caso reconhecida
    a diferença com o valor contábil no resultado, salvo quando  aumento superior a eventual perda anterior
    por impairmente, quando deverá ser creditado diretamente no Patrimônio Líquido, em ajustes de avaliação
    patrimonial(CPC 28, item 62). Referidos valores  deverão ser computados na apuração  Lucro Real à
    medida que ativo for realizado(arts. 13/14, Lei nº 12.973/2014). Detalhes sobre a contabilização estão
    descritos no Anexo I, exemplos 5/6,  Instrução Normativa SRF nº 1.515/2014). Apenas no caso da conta
    contábil que registra o ativo consolidar vários itens de mesma natureza, pode-se  utilizar uma mesma
    subconta coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art. 33, §3º, Instrução
    Normativa SRF nº 1.515/2014)
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
