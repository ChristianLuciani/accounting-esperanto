    no país, apurada segundo regramentos societários,  e tratada no art. 20, inc.II, Decreto-Lei nº 1.598/1977.
    A amortização societária ocorrerá, conforme bem ou direito for realizado na investida, podendo valor
    ser excluído do Lucro Real do período(art. 25, Decreto-Lei nº 1.598/1977) e posteriormente  ser necessário
    adicionar,  quando da alienação da participação, para fins de cálculo do ganho ou perda de capital(art.
    33, inc. II,  Decreto-Lei nº 1.598/1977 ). O saldo original apurado na data da aquisição societária
    deve ser registrado na Parte B do eLalur, somente  vindo a ser considerado integrante do custo do
    bem ou direito que lhe deu causa, ou ser adicionado ao Lucro Real inclusive em parcelas mensais, nos
    termos do  art. 21 da Lei nº 12.973/2014. No caso do referido bem ou direito e a  menos-valia correlata
    fundirem-se em um mesmo patrimônio, o saldo da menos-valia registrado na investidora na data do evento
    societário(p.ex. incorporação) integrará o custo do bem ou direito na sucessora. Ademais,  eventual
    diferença a menor em relação ao saldo na data da aquisição societária(registrado na parte B), deverá
    ser adicionado ao Lucro Real do período em que o bem ou direito for sendo realizado na sucessora(p.ex.
    depreciação). Contudo, se determinado  bem ou direito que lhe deu causa não estiver presente no patrimônio
    da investida na data do evento societário, o correspondente valor de mais-valia deve ser baixado do
    saldo original registrado na Parte B, sem afetar o Lucro Real(art. 101, §4º,  da Instrução Normativa
    SRF nº 1.515/2014).
