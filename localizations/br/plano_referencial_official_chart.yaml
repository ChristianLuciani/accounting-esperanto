- code: 1.01.01.05.01
  name: Títulos para Negociação - Mensurados a Valor Justo Por Meio do Resultado (VJPR) - No País
  name_raw: Títulos para Negociação - Mensurados a Valor Justo Por Meio do Resultado (VJPR) - No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, cuja contraparte ou ambiente negocial tenham sede
    ou domicílio no país, sobre os quais há a intenção de negociação no curto prazo ou se a mensuração
    pelo valor justo diminuir ou eliminar alguma inconsistência de mensuração de acordo com a gestão financeira
    da empresa (fair value option) e ainda não estejam melhor classificados em outras contas mais específica,
    mesmo que extrapolem o conceito da Lei nº 6.385/76. Os derivativos utilizados como hedge devem ser
    registrados no grupo 1.01.01.06.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.05.02
  name: Títulos Disponíveis para Venda - No País
  name_raw: Títulos Disponíveis para Venda - No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, cuja contraparte ou ambiente negocial tenham sede
    ou domicílio no país, sobre os quais não há definição de quando nem quais condições vai negociá-los
    e ainda não estejam melhor classificados em outras contas mais específica, mesmo que extrapolem o
    conceito da Lei nº 6.385/76. Contrapartida das alterações no seu valor justo, bem como custos de transação,
    devem ser reconhecidos no Patrimônio Líquido até a realização do ativo.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.01.05.03
  name: Títulos Mantidos até o Vencimento - No País
  name_raw: Títulos Mantidos até o Vencimento - No País
  tipo: A
  conta_superior: 1.01.01.05
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, cuja contraparte ou ambiente negocial tenham sede
    ou domicílio  no país, não derivativos, com pagamentos fixos ou determináveis e com vencimento fixo,
    para os quais há a intenção e a capacidade de se manter até o vencimento e ainda não estejam melhor
    classificados em outras contas mais específica, mesmo que extrapolem o conceito da Lei nº 6.385/76.
    Esses títulos são avaliados pelo método de custo amortizado, com os custos de transação capitalizados
    ao valor do ativo. Ações e outros títulos patrimonias não devem receber esta classificação. Títulos
    públicos e de renda fixa constumam receber esta classificação.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
