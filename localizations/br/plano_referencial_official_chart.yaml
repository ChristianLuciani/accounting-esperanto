- code: 3.01.01.09.01.08
  name: Outras Despesas Financeiras
  name_raw: (-) Outras Despesas Financeiras
  tipo: A
  conta_superior: 3.01.01.09.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as despesas relativas a juros, não incluídas nas contas específicas,
    tais despesas serão obrigatoriamente apropriadas, segundo o regime de competência.

    Atenção:

    1) As variações monetárias passivas decorrentes da atualização das obrigações, em função de índices
    ou coeficientes aplicáveis por disposição legal ou contratual, devem ser informadas como despesa financeira.

    2) As variações cambiais passivas não devem ser informadas nesta linha, e sim em conta específica.'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
- code: 3.01.01.09.01.09
  name: Resultados Negativos em Participações Societárias Avaliadas pelo Método de Equivalência Patrimonial
  name_raw: (-) Resultados Negativos em Participações Societárias Avaliadas pelo Método de Equivalência
    Patrimonial
  tipo: A
  conta_superior: 3.01.01.09.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as perdas por ajustes no valor de investimentos relevantes avaliados
    pelo método da equivalência patrimonial, decorrentes de prejuízos apurados nas controladas e coligadas.
    O valor indicado deve ser adicionado ao lucro líquido, para determinação do lucro real.

    Atenção:

    1) Considera-se controlada a filial, a agência, a sucursal, a dependência ou o escritório de representação
    no exterior, sempre que os respectivos ativos e passivos não estejam incluídos na contabilidade da
    investidora, por força de normatização específica.

    2) Devem, também, ser indicados nesta linha os resultados negativos derivados de participações societárias
    no exterior, avaliadas pelo patrimônio líquido. Incluem-se, nestas informações, as perdas apuradas
    em filiais, sucursais e agências da pessoa jurídica localizadas no exterior.'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
