    \ estatutária, contratual ou por deliberação da assembleia de acionistas ou sócios. \nPara efeito\
    \ de apuração do lucro real, somente são dedutíveis as participações atribuídas indiscriminadamente\
    \ a todos os empregados que se encontrem na mesma situação de emprego, e desde que atendidos os demais\
    \ requisitos legais definidos na Lei nº 10.101, de 19 de dezembro de 2000.\nAtenção: É vedado qualquer\
    \ pagamento de antecipação ou qualquer distribuição de valores a título de participação nos lucros\
    \ ou resultados da empresa em periodicidade inferior a um semestre civil, ou mais de duas vezes no\
