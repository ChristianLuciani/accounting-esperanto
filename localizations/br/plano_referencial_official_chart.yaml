- code: 3.01.01.05.01.08
  name: Rendimentos e Ganhos de Capital Auferidos no Exterior
  name_raw: Rendimentos e Ganhos de Capital Auferidos no Exterior
  tipo: A
  conta_superior: 3.01.01.05.01
  nivel: 6
  natureza: 4
  is_contra: false
