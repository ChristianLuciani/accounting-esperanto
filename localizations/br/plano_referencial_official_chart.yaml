  tipo: A
  conta_superior: 1.02.02.01
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram a mais-valia relativa à participação societária anterior, nos casos
    de aquisição de participações em estágios. Ainda que a norma contábil possa determinar a baixa deste
    valor e reconhecimento de nova mensuração das parcelas envolvidas na participação, este valor deve
    ficar apartado em subconta de controle, submetendo-se ao tratamento fiscal adequado, conforme arts.
    37/39, Lei nº 12.973/2014. A operacionalização desta subconta é melhor evidenciada no exemplo constante
    no anexoII da  Instrução Normativa SRF nº 1.515/2014).
