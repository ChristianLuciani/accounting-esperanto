  conta_superior: 1.01.02.02
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram as diferenças positivas ou negativas, na data da adoção dos efeitos
    da Lei nº 12.973/2014, entre o valor do ativo mensurado de acordo as disposições da Lei nº 6.404/1976
    e o valor mensurado pelos métodos e critérios vigentes em 31/12/2007(arts. 66/67, Lei nº 12.973/2014).
    Conforme disciplinado art. 169, § 9ª, Instrução Normativa SRF nº 1.515/2014, cada subconta de adoção
    inicial deve registrar individualmente a diferença de valor identificada em cada ativo.  Apenas no
    caso da conta contábil que registra o ativo consolidar vários itens de mesma natureza, pode-se  utilizar
    uma mesma subconta coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art. 169, §6º,
    Instrução Normativa SRF nº 1.515/2014)
