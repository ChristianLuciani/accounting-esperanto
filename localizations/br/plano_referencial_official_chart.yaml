- code: 3.01.01.07.01.22
  name: Multas
  name_raw: (-) Multas
  tipo: A
  conta_superior: 3.01.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram as despesas com multas.                                                                                                                                                                                                                                                                         São
    totalmente indedutíveis não só as multas impostas por infrações fiscais de que resulte falta ou insuficiência
    de pagamento de tributo ou contribuição, como também aquelas que decorram de infrações a normas não
    tributárias (multas de trânsito, por exemplo). São dedutíveis as multas fiscais de natureza compensatória
    e aquelas impostas por descumprimento de obrigações tributárias, meramente acessórias, de que não
    resulte falta ou insuficiência de pagamento de tributo ou contribuição (PN CST nº 61, de 1979).                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 Atenção:
    Os valores das multas indedutíveis devem ser adicionados ao Lucro Real.'
