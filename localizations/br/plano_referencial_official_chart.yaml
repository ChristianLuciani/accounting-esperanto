- code: 3.11.01.07.01.16
  name: Demais Impostos, Taxas e Contribuições, exceto IR e CSLL
  name_raw: (-) Demais Impostos, Taxas e Contribuições, exceto IR e CSLL
  tipo: A
  conta_superior: 3.11.01.07.01
  nivel: 6
  natureza: 4
  is_contra: true
  orientacoes: 'Contas que registram os demais tributos e contribuições. Os valores indicados nesta conta
    são dedutíveis, para efeito de determinação do lucro real, no período de apuração em que ocorrer o
    fato gerador.

    Não devem ser incluídas as importâncias:

    a) incorporadas ao custo de bens do ativo não-circulante, exceto realizável a longo prazo;

    b) correspondentes aos impostos não recuperáveis, incorporados ao custo das matérias-primas, materiais
    secundários, materiais de embalagem e mercadorias destinadas à revenda;

    c) correspondentes aos impostos recuperáveis;

    d) correspondentes aos impostos e contribuições redutores da receita bruta;

    e) correspondentes às Contribuições para o PIS/PASEP e à COFINS incidentes sobre as demais receitas
    operacionais;

    f) correspondentes à contribuição social sobre o lucro líquido e ao imposto de renda devidos.'
  statement: Demonstração do Resultado (Contas de Resultado) - PJ do Lucro Real - PJ em Geral
  source_sheet: L300A
