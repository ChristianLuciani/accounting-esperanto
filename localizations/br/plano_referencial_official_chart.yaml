- code: 1.02.02.02.60
  name: Subconta - Ajuste a Valor Justo (AVJ) Reflexo - Ganho ou Perda na Investida – no Exterior
  name_raw: Subconta - Ajuste a Valor Justo (AVJ) Reflexo - Ganho ou Perda na Investida – no Exterior
  tipo: A
  conta_superior: 1.02.02.02
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os ganhos ou perdas na mensuração de participação societária, no exterior,
    avaliada pelo método da equivalência patrimonial, decorrentes de alterações do valor justo de ativos
    ou passivos na investida. Se a investidora possuir saldos de mais-valia ou menos-valia  derivados
    destes mesmos bens, deve primeiro baixar estes valores(art. 24-A/24-B, Decreto-Lei nº 1.598/1977).
    Somente se o AVJ for referente a outros bens da investida, ou já tenha ocorrido  exaurimento dos correlatos
    mais ou menos-valia, então passará a registrar estes ganhos ou perdas reflexas em subconta na investidora.
    Caso bem que sofra o AVJ for único, a descrição da subconta deve identificá-lo, em sendo vários, pode
    utilizar uma mesma subconta coletiva, desde que demonstre-os em razão auxiliar vinculado à ECD(art.
    33, §4º, Instrução Normativa SRF nº 1.515/2014)
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.02.65
  name: Subconta - Ajuste a Valor Justo (AVJ) de Subscrição de Capital - Ganho ou Perda de Capital – no
