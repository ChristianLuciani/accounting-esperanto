  name_raw: ( - ) Subconta – Ajuste a Valor Presente (AVP) -  Estoque Mercadorias
  tipo: A
  conta_superior: 1.01.03.01
  nivel: 5
  natureza: 1
  is_contra: true
  orientacoes: Contas que registram contrapartidas dos ajustes a valor presente efetuados sobre os passivos
    decorrentes de compras a prazo de estoques. Referidos valores serão apropriados ao resultado pelo
    regime de competência e adicionados ao Lucro Real. Concomitante controle ocorrerá nesta subconta até
    a revenda da mercadoria, quando valor do AVP poderá ser excluído do Lucro Real do período (art.5º,
    Lei nº 12.973/2014). Detalhes sobre a contabilização estão descritos no Anexo I, exemplo 4,  Instrução
    Normativa SRF nº 1.515/2014). Apenas no caso da conta contábil que registra o ativo consolidar vários
    itens de mesma natureza, pode-se  utilizar uma mesma subconta coletiva, desde que demonstre-os em
    razão auxiliar vinculado à ECD(art. 33, §3º, Instrução Normativa SRF nº 1.515/2014)
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.01.03.01.90
