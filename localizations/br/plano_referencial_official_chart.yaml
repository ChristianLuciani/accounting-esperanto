  tipo: A
  conta_superior: 1.02.01.02
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram ativos financeiros, cuja contraparte ou ambiente negocial tenham sede
    ou domicílio no país, com pagamentos fixos ou determináveis e com vencimento fixo, para os quais há
    a intenção e a capacidade de se manter até o vencimento e ainda não estejam melhor classificados em
    outras contas mais específica, mesmo que extrapolem o conceito da Lei nº 6.385/76. Esses títulos são
    avaliados pelo método de custo amortizado, com os custos de transação capitalizados ao valor do ativo.
    Ações e outros títulos patrimoniais não devem receber esta classificação. Títulos públicos e de renda
    fixa constumam receber esta classificação.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
