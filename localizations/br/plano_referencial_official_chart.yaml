  is_contra: false
  orientacoes: 'Contas que registram móveis, utensílios e instalações comerciais recebidos em arrendamento,
    ou seja, no qual são substancialmente transferidos à arrendatária os riscos e benefícios inerentes
    à propriedade. O contrato é, ou contém, um arrendamento se ele transmite o direito de controlar o
    uso de ativo identificado por um período de tempo em troca de contraprestação, conforme item 9 do
    CPC06 (R2), sendo que o título de propriedade pode ou não vir a ser transferido. A classificação depende
    da essência da transação e não da forma do contrato. Nos termos do item 23 do CPC06 (R2), no reconhecimento
    inicial estes ativos devem ser mensurados ao custo, e de acordo com o item 24 do mesmo pronunciamento
    contábil, o custo do ativo de direito de uso deve compreender: a) o valor da mensuração inicial do
    passivo de arrendamento; b) quaisquer pagamentos de arrendamento já efetuados, menos quaisquer incentivos
    de arrendamento recebidos; c) quaisquer custos diretos iniciais do arrendatário; e d) estimativa de
    custos a serem incorridos na desmontagem e remoção do ativo subjacente. Para fins fiscais, a pessoa
    jurídica arrendatária deverá adicionar ao Lucro Real qualquer despesa com depreciação, amortização
    ou exaustão (art.13, Decreto-Lei nº 1.598/1977), todavia, poderá excluir as contraprestações pagas
    ou creditadas (art. 47, Lei nº 12.973/2014). Os valores decorrentes do Ajuste a Valor Presente efetivado
    sobre a dívida do contrato também devem ser adicionados ao Lucro Real, conforme venham a ser reconhecidos
    como despesa financeira (art. 48, Lei nº 12.973/2014). Maiores detalhes no art. 175 da Instrução Normativa
    RFB nº 1.700/2017. As diferenças percebidas nos valores do ativo, tratadas na adoção inicial da  Lei
    nº 12.973/2014¸ arts. 66 e 67, não devem gerar controle em subcontas, conforme art. 303,  Instrução
    Normativa RFB nº 1.700/2017.'
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
