- code: 1.02.02.03.01
  name: Imóveis Próprios em Construção -  Propriedades para Investimento
  name_raw: Imóveis Próprios em Construção -  Propriedades para Investimento
  tipo: A
  conta_superior: 1.02.02.03
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os imóveis próprios em construção, destinados a auferir aluguel ou
    para valorização do capital, ou para ambas, desde que não utilizados na exploração ou na manutenção
    das atividades da empresa ou se  destinem à venda no curso ordinário do negócio. Neste último caso,
    constarão em estoques. Consoante disposto nos itens 44/48,  ICPC10, devem receber esta classificação
    ainda que o objeto da pessoa jurídica seja locação de imóveis, deixando para o imobilizado apenas
    quando aluguel estiver vinculado a ativo complementar na produção ou no fornecimento de bens ou serviços.
    Nos termos do CPC 28, sua mensuração inicial deve ser pelo custo, já nas subsequentes, a depender
    de sua política contábil, regra geral, escolher entre o método do valor justo ou do custo. Seu item
    53 contempla tratamento específico para propriedade em construção.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.03.05
  name: Imóveis Próprios – Pelo Custo -  Propriedades para Investimento
  name_raw: Imóveis Próprios – Pelo Custo -  Propriedades para Investimento
  tipo: A
  conta_superior: 1.02.02.03
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os imóveis próprios mensurados pelo custo, destinados a auferir aluguel
    ou para valorização do capital, ou para ambas, desde que não utilizados na exploração ou na manutenção
    das atividades da empresa ou se  destinem à venda no curso ordinário do negócio. Neste último caso,
    constarão em estoques. Consoante disposto nos itens 44/48,  ICPC10, devem receber esta classificação
    ainda que o objeto da pessoa jurídica seja locação de imóveis, deixando para o imobilizado apenas
    quando aluguel estiver vinculado a ativo complementar na produção ou no fornecimento de bens ou serviços.
    Nos termos do CPC 28, sua mensuração inicial deve ser pelo custo, exceto custo atribuível  resultante
    de nova mensuração, ocorrida nos termos dos itens 20/27, ICPC 10. Já nas subsequentes, a depender
    de sua política contábil, regra geral, escolher entre o método do valor justo ou do custo, sendo uniforme
    para todas propriedades para investimento. Ainda que utilize o custo para mensuração, deve divulgar
    o valor justo em Nota Explicativa encaminhada pela ECD.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.03.06
  name: Imóveis Próprios – Valor Justo - Propriedades para Investimento
  name_raw: Imóveis Próprios – Valor Justo - Propriedades para Investimento
  tipo: A
  conta_superior: 1.02.02.03
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os imóveis próprios mensurados a valor justo, destinados a auferir
    aluguel ou para valorização do capital, ou para ambas, desde que não utilizados na exploração ou na
    manutenção das atividades da empresa ou se  destinem à venda no curso ordinário do negócio. Neste
    último caso, constarão em estoques. Consoante disposto nos itens 44/48,  ICPC10, devem receber esta
    classificação ainda que o objeto da pessoa jurídica seja locação de imóveis, deixando para o imobilizado
    apenas quando aluguel estiver vinculado a ativo complementar na produção ou no fornecimento de bens
    ou serviços.Nos termos do CPC 28, sua mensuração inicial deve ser pelo custo, já nas subsequentes,
    a depender de sua política contábil, regra geral, escolher entre o método do valor justo ou do custo,
    sendo uniforme para todas propriedades para investimento.  Uma vez adotado  valor justo, deve manter
    o método.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
- code: 1.02.02.03.08
  name: Imóveis Objeto de Arrendamento – Propriedades para Investimento
  name_raw: Imóveis Objeto de Arrendamento – Propriedades para Investimento
  tipo: A
  conta_superior: 1.02.02.03
  nivel: 5
  natureza: 1
  is_contra: false
  orientacoes: Contas que registram os imóveis da arrendatária, destinados a auferir aluguel ou para valorização
    do capital, ou para ambas, desde que não utilizados na exploração ou na manutenção das atividades
    da empresa ou se  destinem à venda no curso ordinário do negócio.  Consoante disposto nos itens 44/48,  ICPC10,
    devem receber esta classificação ainda que o objeto da pessoa jurídica seja locação de imóveis, deixando
    para o imobilizado apenas quando aluguel estiver vinculado a ativo complementar na produção ou no
    fornecimento de bens ou serviços.Nos termos do CPC 28, item 25, sua mensuração inicial deve ser o
    menor entre o valor justo da propriedade e o valor presente dos pagamentos mínimos do arrendamento.
    Nas mensurações subsequentes, a depender de sua política contábil, regra geral, escolher entre o método
    do valor justo ou do custo, salvo se receber o imóvel em arrendamento operacional, quando método pelo
    justo será obrigatório, item 34.  A metodologia deve ser uniforme para todas propriedades para investimento.  Uma
    vez adotado  valor justo, deve manter o método.
  statement: Balanço Patrimonial (Contas Patrimoniais) - PJ do Lucro Real - PJ em Geral
  source_sheet: L100A
