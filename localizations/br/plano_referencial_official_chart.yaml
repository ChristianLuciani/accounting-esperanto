    em conta de participação, para a indicação:

    a) de lucros derivados de participação em SCP, avaliadas pelo custo de aquisição;

    b) dos ganhos por ajustes no valor de participação em SCP, avaliadas pelo método da equivalência patrimonial.

    Os lucros recebidos de investimento em SCP, avaliado pelo custo de aquisição, ou a contrapartida do
    ajuste do investimento ao valor do patrimônio líquido da SCP, no caso de investimento avaliado por
    esse método, podem ser excluídos na determinação do lucro real dos sócios, pessoas jurídicas, das
    referidas sociedades (Decreto nº 3.000, de 1999, art. 149).'
